<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header id="cabecalho">
        <img class="logo" src="img/logo.svg" alt="">
    </header>
    <main class="selecao-de-personagens">
        <section class="personagens">
            <h1 class="titulo">selecione um personagem</h1>
            <ul class="lista-de-personagens">
                <li class="personagem" id="ciclope" data-name="Ciclope" data-description="Ele tem o poder de disparar rajadas ópticas por um
                acidente com ele quando criança, mas não consegue controlá-los">
                    <img src="img/card-ciclope.jpg" alt="Personagem Ciclope">

                </li>
                <li class="personagem" id="jean-grey" data-name="jean-grey"
                    data-description="Jean-grey é uma mutante nível ômega e o principal avatar da força Fenix, no qual manifesta poderes cósmicos. A telepatia e telecinese">
                    <img src="img/card-jean-grey.jpg" alt="Personagem jean-grey">

                </li>
                <li class="personagem" id="lince-negra" data-name="lince-negra"
                    data-description="Ela tem poder de atravessar matéria sólida, campos de energia, rajadas ópticas, continuando intacta, e também tem o poder de andar no ar ">
                    <img src="img/card-lince-negra.jpg" alt="Personagem lince-negra">

                </li>
                <li class="personagem" id="tempestade" data-name="tempestade" data-description="Tem o poder de controlar as forças da natureza, muito poderosa ela pode produzir raios, chuvas, gelos, ventos, neblina, entre outros efeitos">
                    <img src="img/card-tempestade.jpg" alt="Personagem tempestade">

                </li>
                <li class="personagem" id="vampira" data-name="vampira" data-description="Ele tem o poder de disparar rajadas ópticas por um
                acidente com ele quando criança, mas não consegue controlá-los">

                </li>
                <li class="personagem" id="wolverine" data-name="wolverine" data-description="Ele tem o poder de disparar rajadas ópticas por um
                acidente com ele quando criança, mas não consegue controlá-los">
                    <img src="img/card-wolverine.jpg" alt="Personagem wolverine">

                </li>
                <li class="personagem" id="noturno" data-name="noturno" data-description="Ele tem o poder de disparar rajadas ópticas por um
                acidente com ele quando criança, mas não consegue controlá-los">
                    <img src="img/card-noturno.jpg" alt="Personagem noturno">

                </li>
                <li class="personagem" id="magneto" data-name="magneto" data-description="Ele tem o poder de disparar rajadas ópticas por um
                acidente com ele quando criança, mas não consegue controlá-los">
                    <img src="img/card-magneto.jpg" alt="Personagem magneto">

                </li>

            </ul>
        </section>
    </main>

</html>
